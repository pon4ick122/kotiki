<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Звёзды дня: гороскоп и таро</title>
<style>
:root{
  --bg1:#0b0a24; --bg2:#1d1247; --ink:#fff; --muted:#b8b2e0; --gold:#ffd27a; --gold-d:#d69a2c;
  --card:#ffffff10; --card-b:#ffffff24; --violet:#8b5cf6; --pink:#ff7ab6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#0b0a24}
html,body{margin:0;min-height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);
  background:radial-gradient(circle at 15% 0%,#6a3bd155 0,transparent 45%),radial-gradient(circle at 100% 90%,#ff7ab626 0,transparent 40%),linear-gradient(170deg,var(--bg1),var(--bg2));
  background-attachment:fixed;min-height:100%}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100vh;
  padding:max(14px,env(safe-area-inset-top)) 16px calc(86px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
header h1{font-size:19px;margin:0;flex:1;font-weight:800;letter-spacing:.2px}
header h1 small{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
.streak{background:#ff9a3c22;border:1px solid #ff9a3c66;color:#ffc58a;border-radius:14px;padding:6px 10px;font-weight:800;font-size:14px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--card-b);border-radius:20px;padding:16px;margin-bottom:12px;backdrop-filter:blur(6px)}
.card h2{margin:0 0 8px;font-size:17px}
.card p{margin:0 0 10px;line-height:1.5;font-size:15.5px}
.card p:last-child{margin-bottom:0}
.muted{color:var(--muted)}
.sign-head{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.sign-sym{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:36px;font-family:"Segoe UI Symbol","DejaVu Sans",serif;flex:none;
  background:radial-gradient(circle at 35% 30%,#ffe7b0,#ffbe4a 55%,#c98418);color:#3a1d00;box-shadow:0 0 24px #ffc85a55}
.sign-head b{font-size:21px;display:block}
.sign-head span{font-size:13.5px;color:var(--muted)}
.change{margin-left:auto;background:none;border:1px solid var(--card-b);color:var(--muted);border-radius:12px;padding:7px 10px;font-size:13px;cursor:pointer}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.meter{background:#ffffff0c;border-radius:14px;padding:9px 6px;text-align:center;font-size:12.5px;color:var(--muted)}
.meter b{display:block;font-size:17px;color:#fff;margin-top:2px}
.bar{height:5px;border-radius:3px;background:#ffffff1a;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--gold))}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;color:#2b1600;
  background:linear-gradient(180deg,#ffe19a,var(--gold-d));box-shadow:0 4px 0 #8c5a0e,0 8px 20px #0005;margin-top:10px}
.btn.ghost{background:#ffffff14;color:#fff;box-shadow:none;border:1px solid var(--card-b)}
.btn.violet{background:linear-gradient(180deg,#a98bff,#6c3ff0);color:#fff;box-shadow:0 4px 0 #3f1fa3,0 8px 20px #0005}
.btn:active{transform:translateY(2px)}
.ad{font-size:11px;font-weight:800;background:#0003;border-radius:6px;padding:2px 6px;letter-spacing:.3px}
.locked{position:relative}
.locked .blur{filter:blur(6px);user-select:none;pointer-events:none;opacity:.7}
.lucky{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{background:#ffffff12;border-radius:12px;padding:7px 10px;font-size:13.5px}
.chip b{color:var(--gold)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;
  background:#0b0a24ee;border-top:1px solid #ffffff1c;padding:6px 6px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}
nav .in{display:flex;max-width:520px;width:100%}
nav button{flex:1;background:none;border:0;color:var(--muted);font-size:11.5px;font-weight:700;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px}
nav button i{font-style:normal;font-size:23px;filter:grayscale(.6);opacity:.75}
nav button.on{color:#fff;background:#ffffff12}
nav button.on i{filter:none;opacity:1}
/* знаки */
.grid12{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.zbtn{background:#ffffff10;border:1px solid var(--card-b);border-radius:16px;color:#fff;padding:12px 4px;cursor:pointer;text-align:center}
.zbtn i{font-style:normal;font-size:30px;display:block;color:var(--gold);font-family:"Segoe UI Symbol","DejaVu Sans",serif}
.zbtn b{font-size:14px;display:block;margin-top:3px}
.zbtn small{font-size:11px;color:var(--muted)}
.zbtn.sel{border-color:var(--gold);background:#ffd27a22}
/* таро */
.tarot-wrap{display:flex;justify-content:center;gap:10px;perspective:900px;margin:6px 0 12px}
.tcard{width:150px;height:240px;position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.4,.5,1);cursor:pointer}
.tcard.small{width:96px;height:156px}
.tcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px}
.back{background:repeating-linear-gradient(45deg,#2a1a6b 0 10px,#22145a 10px 20px);border:2px solid var(--gold-d);box-shadow:inset 0 0 0 6px #1a0f45,inset 0 0 0 8px #d69a2c88}
.back::after{content:"✦";font-size:44px;color:var(--gold)}
.front{transform:rotateY(180deg);background:linear-gradient(170deg,#fff6df,#f1d9a4);color:#3a1d00;border:2px solid var(--gold-d)}
.front .num{font-size:13px;font-weight:800;letter-spacing:2px;opacity:.7}
.front .em{font-size:58px;margin:10px 0}
.tcard.small .front .em{font-size:36px;margin:4px 0}
.front .nm{font-size:16px;font-weight:900}
.tcard.small .front .nm{font-size:12px}
.slot{text-align:center;font-size:12px;color:var(--muted);margin-top:6px}
.yn{display:inline-block;font-weight:900;color:var(--gold);font-size:18px}
/* печенька */
.cookie{font-size:110px;text-align:center;cursor:pointer;user-select:none;transition:transform .15s;margin:6px 0}
.cookie:active{transform:scale(.92) rotate(-6deg)}
.cookie.crack{animation:crack .6s forwards}
@keyframes crack{30%{transform:rotate(-12deg) scale(1.1)}60%{transform:rotate(10deg) scale(1.15)}100%{transform:scale(0);opacity:0}}
.paper{background:linear-gradient(180deg,#fffaf0,#f3e4c2);color:#3a2a10;border-radius:6px;padding:18px 16px;font-size:17px;line-height:1.45;text-align:center;font-weight:600;
  box-shadow:0 6px 18px #0006;transform:rotate(-1.2deg);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3) rotate(-10deg);opacity:0}}
/* совместимость */
.pair{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pick{flex:1;background:#ffffff10;border:1px solid var(--card-b);border-radius:16px;color:#fff;padding:12px 6px;text-align:center;cursor:pointer;font-size:14px;font-weight:700}
.pick i{font-style:normal;font-size:30px;display:block;color:var(--gold);font-family:"Segoe UI Symbol","DejaVu Sans",serif}
.heart{font-size:30px}
.big{font-size:52px;font-weight:900;text-align:center;background:linear-gradient(90deg,var(--pink),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0}
/* оверлей */
#overlay{position:fixed;inset:0;z-index:20;background:#05041acc;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
#overlay.show{display:flex}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:linear-gradient(180deg,#24185c,#140d38);border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:0 0 12px;font-size:19px;text-align:center}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#000c;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
.fakead{position:fixed;inset:0;z-index:50;background:#000e;display:grid;place-items:center;text-align:center;font-size:20px}
.fakead b{font-size:48px}
.foot{font-size:11.5px;color:#8f89bd;text-align:center;margin:14px 0 4px;line-height:1.4}
.fade{animation:fade .35s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="app">
  <header>
    <h1 id="hTitle">Звёзды дня<small id="hDate"></small></h1>
    <div class="streak" id="streak" title="Дней подряд"></div>
  </header>
  <main id="view"></main>
  <div class="foot">Прогнозы составлены для развлечения и хорошего настроения ✨</div>
</div>
<nav><div class="in">
  <button data-tab="horo"><i>🔮</i>Гороскоп</button>
  <button data-tab="tarot"><i>🃏</i>Таро</button>
  <button data-tab="cookie"><i>🥠</i>Печенька</button>
  <button data-tab="love"><i>💞</i>Пара</button>
</div></nav>
<div id="overlay"></div>
<div id="toast"></div>

<script>
"use strict";
/* ================= ПЛАТФОРМА ================= */
const APP_URL = "https://vk.com/app54898242";
let lastAdAt = Date.now();
const Platform = {
  kind: "local", sdk: null,
  async init() {
    if (/(?:^|[?&])vk_app_id=\d+/.test(location.search)) {
      try { await loadScript("vk-bridge.min.js"); await vkBridge.send("VKWebAppInit"); this.sdk = vkBridge; this.kind = "vk"; }
      catch (e) { console.warn("VK Bridge не загрузился", e); }
    } else if (/itch\.io|itch\.zone|hwcdn/.test(location.hostname)) this.kind = "noads";
  },
  rewarded(onReward) {
    if (this.kind === "noads") { onReward(); return; }
    lastAdAt = Date.now();
    const fail = () => toast("Реклама пока недоступна, попробуй чуть позже");
    if (this.kind === "vk") {
      this.sdk.send("VKWebAppShowNativeAds", { ad_format: "reward" })
        .then(d => { d && d.result ? onReward() : fail(); }).catch(fail);
      return;
    }
    fakeAd(onReward);
  },
  interstitial() {
    if (this.kind !== "vk") return;
    lastAdAt = Date.now();
    this.sdk.send("VKWebAppShowNativeAds", { ad_format: "interstitial" }).catch(() => {});
  },
  async userInfo() {
    if (this.kind !== "vk") return null;
    try { return await this.sdk.send("VKWebAppGetUserInfo"); } catch (e) { return null; }
  },
  favorites() { if (this.kind === "vk") this.sdk.send("VKWebAppAddToFavorites").catch(() => {}); },
  shareLink() {
    if (this.kind === "vk") this.sdk.send("VKWebAppShare", { link: APP_URL }).catch(() => {});
    else copyText(APP_URL);
  },
  story(dataUrl, fallbackText) {
    if (this.kind !== "vk") { toast("Истории работают внутри ВКонтакте"); return; }
    this.sdk.send("VKWebAppShowStoryBox", { background_type: "image", blob: dataUrl,
      attachment: { text: "go_to", type: "url", url: APP_URL } })
      .catch(() => this.sdk.send("VKWebAppShowWallPostBox", { message: fallbackText, attachments: APP_URL }).catch(() => {}));
  }
};
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.append(s); }); }
function fakeAd(cb) {
  const o = document.createElement("div"); o.className = "fakead"; let n = 3;
  o.innerHTML = `<div>📺 Тут будет реклама<br><b>${n}</b><br><small>(заглушка для теста)</small></div>`;
  document.body.append(o);
  const iv = setInterval(() => { n--; if (n <= 0) { clearInterval(iv); o.remove(); cb && cb(); } else o.querySelector("b").textContent = n; }, 1000);
}
function copyText(t) { try { navigator.clipboard.writeText(t); toast("Ссылка скопирована"); } catch (e) {} }
const $ = id => document.getElementById(id);
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2200); }

/* ================= СЛУЧАЙНОСТЬ ПО ДАТЕ ================= */
function hash(s) { let h = 1779033703 ^ s.length; for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } return h >>> 0; }
function rng(seed) { let a = hash(seed); return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
function dayKey(d = new Date()) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }

function signByDate(day, month) {
  // знак, у которого дата начала — последняя не позже даты рождения (до 20 января — Козерог)
  const order = [...SIGNS].sort((a, b) => a.from[0] - b.from[0] || a.from[1] - b.from[1]);
  let res = order[order.length - 1];
  for (const s of order) if (month > s.from[0] || (month === s.from[0] && day >= s.from[1])) res = s;

function relation(a, b) {
  if (a.el === b.el) return "same";
  const pair = [a.el, b.el].sort().join("+");
  if (pair === "air+fire" || pair === "earth+water") return "good";
  if (pair === "fire+water" || pair === "air+earth") return "hard";
  return "mid";
}
function compat(a, b) {
  const rel = relation(a, b), r = rng([a.id, b.id].sort().join("&"));
  const base = { same: 78, good: 86, mid: 64, hard: 52 }[rel];
  return { rel, pct: Math.min(99, base + Math.floor(r() * 13)), text: pick(r, COMPAT[rel]), tip: pick(r, COMPAT.tips),
    love: Math.min(99, base - 6 + Math.floor(r() * 20)), friend: Math.min(99, base - 4 + Math.floor(r() * 18)), work: Math.min(99, base - 10 + Math.floor(r() * 24)) };
}

function touchStreak() {
  if (save.last === TODAY) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  save.streak = save.last === dayKey(y) ? save.streak + 1 : 1;
  save.best = Math.max(save.best, save.streak);
  save.last = TODAY; save.opens++;
  // чистим старые дни
  for (const k of ["unlocked", "tarot", "cookie"]) for (const d in save[k]) if (d !== TODAY) delete save[k][d];
  store();
}

  v.innerHTML = `<div>
    <div class="card" style="text-align:center">
      <h2>Печенька с предсказанием</h2>
      ${has ? `<div class="paper">${last}</div>` : `<p class="muted">Нажми на печеньку, чтобы разломить её</p><div class="cookie" id="ck">🥠</div>`}
    </div>
    ${has ? `<button class="btn" id="more">🥠 Ещё одна печенька ${adLabel}</button>
      <button class="btn violet" id="send">💌 Отправить другу</button>` : ""}
    ${c.list.length > 1 ? `<div class="card"><h2>Сегодня ты уже узнал</h2>${c.list.slice(0, -1).map(i => `<p>🥠 ${COOKIES[i]}</p>`).join("")}</div>` : ""}
  </div>`;
  const crack = () => {
    let i, tries = 0; do { i = Math.floor(Math.random() * COOKIES.length); } while (c.list.includes(i) && ++tries < 50);
    c.list.push(i); store();
  };
  if ($("ck")) $("ck").onclick = () => { $("ck").classList.add("crack"); crack(); setTimeout(render, 600); };
  if ($("more")) $("more").onclick = () => Platform.rewarded(() => { crack(); render(); });
  if ($("send")) $("send").onclick = () => Platform.shareLink();
}

function renderLove(v) {
  const a = sign(), b = SIGNS.find(s => s.id === save.partner);
  const open = today("unlocked").love === (b && b.id);
  let res = "";
  if (b) {
    const c = compat(a, b);
    const m = (label, val) => `<div class="meter">${label}<b>${val}%</b><div class="bar"><i style="width:${val}%"></i></div></div>`;
    const det = `<div class="meters">${m("Любовь", c.love)}${m("Дружба", c.friend)}${m("Дела", c.work)}</div><p>💡 Совет паре: ${c.tip}</p>`;
    res = `<div class="card fade" style="text-align:center"><div class="big">${c.pct}%</div><p>${c.text}</p></div>
      <div class="card ${open ? "" : "locked"}"><h2>Подробно о вашей паре</h2>${open ? det : `<div class="blur">${det}</div><button class="btn" id="unl">🔓 Открыть подробности ${adLabel}</button>`}</div>
      <button class="btn violet" id="inv">💌 Позвать вторую половинку</button>`;
  }
  v.innerHTML = `<div>
    <div class="card"><h2 style="text-align:center">Совместимость знаков</h2>
      <div class="pair"><div class="pick" id="pa"><i>${a.s}</i>${a.n}</div><div class="heart">💞</div>
      <div class="pick" id="pb"><i>${b ? b.s : "❔"}</i>${b ? b.n : "Выбрать"}</div></div>
    </div>${res}
  </div>`;
  $("pa").onclick = () => setTab("horo");
  $("pb").onclick = () => sheet(signPicker("Знак партнёра"), r => bindPicker(n => { save.partner = n.id; store(); closeSheet(); render(); }, r));
  if ($("unl")) $("unl").onclick = () => Platform.rewarded(() => { today("unlocked").love = b.id; store(); render(); });
  if ($("inv")) $("inv").onclick = () => Platform.shareLink();
}

/* ================= ШТОРКА ================= */
function sheet(html, onReady) {
  const o = $("overlay");
  o.innerHTML = `<div class="sheet" id="sh">${html}</div>`;
  o.classList.add("show");
  o.onclick = e => { if (e.target === o) closeSheet(); };
  onReady && onReady($("sh"));
}
function closeSheet() { $("overlay").classList.remove("show"); $("overlay").innerHTML = ""; }

/* ================= КАРТИНКА ДЛЯ ИСТОРИИ ================= */
function storyImage(s, h) {
  const c = document.createElement("canvas"); c.width = 1080; c.height = 1920;
  const g = c.getContext("2d");
  const grd = g.createLinearGradient(0, 0, 0, 1920); grd.addColorStop(0, "#0b0a24"); grd.addColorStop(1, "#3a1f7a");
  g.fillStyle = grd; g.fillRect(0, 0, 1080, 1920);
  const r = rng("story" + TODAY);
  for (let i = 0; i < 220; i++) { g.fillStyle = `rgba(255,255,255,${0.2 + r() * 0.8})`; g.beginPath(); g.arc(r() * 1080, r() * 1920, r() * 3 + 0.5, 0, 7); g.fill(); }
  g.textAlign = "center";
  g.fillStyle = "#ffd27a"; g.font = "bold 300px serif"; g.fillText(s.s, 540, 620);
  g.fillStyle = "#fff"; g.font = "bold 110px Segoe UI, sans-serif"; g.fillText(s.n, 540, 800);
  g.fillStyle = "#b8b2e0"; g.font = "48px Segoe UI, sans-serif"; g.fillText(dateLabel(), 540, 880);
  g.fillStyle = "#fff"; g.font = "58px Segoe UI, sans-serif";
  wrap(g, h.main, 540, 1040, 900, 80);
  g.fillStyle = "#ffd27a"; g.font = "bold 52px Segoe UI, sans-serif";
  g.fillText(`Любовь ${h.meters.love}% · Дела ${h.meters.work}%`, 540, 1600);
  g.fillStyle = "#b8b2e0"; g.font = "44px Segoe UI, sans-serif"; g.fillText("Звёзды дня ✦ узнай свой прогноз", 540, 1760);
  return c.toDataURL("image/jpeg", 0.88);
}
function wrap(g, text, x, y, maxW, lh) {
  const words = text.split(" "); let line = "";
  for (const w of words) { const t = line ? line + " " + w : w; if (g.measureText(t).width > maxW) { g.fillText(line, x, y); y += lh; line = w; } else line = t; }
  g.fillText(line, x, y);
}
function dateLabel() { const d = new Date(); return `${d.getDate()} ${MONTHS[d.getMonth()]}, ${WDAYS[d.getDay()]}`; }

/* ================= ЗВЁЗДНОЕ НЕБО ================= */
function sky() {
  const c = $("sky"), g = c.getContext("2d"); let stars = [];
  const size = () => { c.width = innerWidth; c.height = innerHeight; stars = Array.from({ length: Math.round(innerWidth * innerHeight / 9000) }, () => ({ x: Math.random() * c.width, y: Math.random() * c.height, r: Math.random() * 1.4 + .3, p: Math.random() * 6 })); };
  size(); addEventListener("resize", size);
  const loop = t => { g.clearRect(0, 0, c.width, c.height);
    for (const s of stars) { g.globalAlpha = .35 + .65 * Math.abs(Math.sin(t / 1400 + s.p)); g.fillStyle = "#fff"; g.beginPath(); g.arc(s.x, s.y, s.r, 0, 7); g.fill(); }
    requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}

/* ================= СТАРТ ================= */
(async function start() {
  sky();
  $("hDate").textContent = dateLabel();
  await Platform.init();
  touchStreak();
  $("streak").textContent = `🔥 ${save.streak} ${plural(save.streak, "день", "дня", "дней")}`;
  document.querySelectorAll("nav button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
  if (!save.sign) {
    const u = await Platform.userInfo();
    if (u && u.bdate) { const [d, m] = u.bdate.split(".").map(Number); if (d && m) { save.sign = signByDate(d, m).id; store(); toast(`Определили твой знак: ${sign().n}. Можно сменить`); } }
    if (u && u.first_name) $("hTitle").firstChild.textContent = `Привет, ${u.first_name}!`;
  }
  setTab("horo");
  if (Platform.kind === "vk" && save.opens === 2 && !save.favAsked) { save.favAsked = true; store(); setTimeout(() => Platform.favorites(), 4000); }
})();
function plural(n, a, b, c) { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c; }
